<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Reader | Tiny Apps</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --accent-3: #f093fb;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f3a 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }

        .drop-area {
            border: 2px dashed var(--accent-1);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(102, 126, 234, 0.05);
        }

        .drop-area:hover {
            border-color: var(--accent-3);
            background: rgba(102, 126, 234, 0.1);
        }

        .drop-area.drag-over {
            background: rgba(102, 126, 234, 0.2);
            border-color: var(--accent-3);
        }

        #fileElem {
            display: none;
        }

        .button {
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .url-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-1);
            background: rgba(102, 126, 234, 0.1);
        }

        .image-preview-container {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 30px;
        }

        #image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .hidden {
            display: none !important;
        }

        .metadata-output {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: rgba(102, 126, 234, 0.1);
            color: var(--accent-1);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border-left: 4px solid #22c55e;
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent-1);
        }

        p {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 Image Metadata Reader</h1>
            <p class="subtitle">Extract EXIF data, GPS, and technical information from your images</p>
        </header>

        <div class="card">
            <div class="input-section">
                <div>
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: var(--accent-1);">Upload Image</label>
                    <div id="drop-area" class="drop-area">
                        <p>Drag & drop your image here</p>
                        <input type="file" id="fileElem" accept="image/*">
                        <label class="button" for="fileElem" style="margin: 0;">Select File</label>
                    </div>
                </div>
                <div class="url-input">
                    <label style="font-weight: 600; color: var(--accent-1);">Or Enter Image URL</label>
                    <input type="text" id="image-url" placeholder="https://example.com/image.jpg">
                    <button class="button" id="load-url-btn">Load Image</button>
                </div>
            </div>
        </div>

        <div id="image-preview-container" class="image-preview-container hidden">
            <img id="image-preview" alt="Image preview">
        </div>

        <div id="success-message" class="success-message hidden"></div>
        <div id="error-message" class="error-message hidden"></div>

        <div id="metadata-output" class="card hidden">
            <h2>📊 Image Metadata</h2>
            <div class="metadata-section">
                <table>
                    <thead>
                        <tr>
                            <th>Attribute</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="metadata-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script>
        const dropArea = document.getElementById('drop-area');
        const fileElem = document.getElementById('fileElem');
        const imageUrl = document.getElementById('image-url');
        const loadUrlBtn = document.getElementById('load-url-btn');
        const imagePreview = document.getElementById('image-preview');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const metadataOutput = document.getElementById('metadata-output');
        const metadataTableBody = document.getElementById('metadata-table-body');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        function showMessage(message, type = 'error') {
            if (type === 'error') {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
            } else {
                successMessage.textContent = message;
                successMessage.classList.remove('hidden');
                errorMessage.classList.add('hidden');
            }
            setTimeout(() => {
                document.getElementById(type === 'error' ? 'error-message' : 'success-message').classList.add('hidden');
            }, 5000);
        }

        function extractMetadata(image) {
            EXIF.getData(image, function() {
                const metadata = EXIF.getAllData(this);
                const basicData = {
                    'Width': image.naturalWidth + ' px',
                    'Height': image.naturalHeight + ' px',
                    'Aspect Ratio': (image.naturalWidth / image.naturalHeight).toFixed(2),
                    'File Size': 'N/A (loaded from source)',
                    'Image Type': 'JPEG/PNG/WebP'
                };

                metadataTableBody.innerHTML = '';
                Object.keys(basicData).forEach(key => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${key}</strong></td><td>${basicData[key]}</td>`;
                    metadataTableBody.appendChild(row);
                });

                if (Object.keys(metadata).length > 0) {
                    Object.keys(metadata).forEach(key => {
                        if (key && metadata[key]) {
                            const row = document.createElement('tr');
                            row.innerHTML = `<td><strong>${key}</strong></td><td>${String(metadata[key]).substring(0, 100)}</td>`;
                            metadataTableBody.appendChild(row);
                        }
                    });
                    showMessage('Metadata extracted successfully!', 'success');
                }

                metadataOutput.classList.remove('hidden');
            });
        }

        function handleImageLoad(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreviewContainer.classList.remove('hidden');
                extractMetadata(imagePreview);
            };
            reader.onerror = () => showMessage('Failed to read file');
            reader.readAsDataURL(file);
        }

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('drag-over');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('drag-over');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleImageLoad(files[0]);
        });

        fileElem.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleImageLoad(e.target.files[0]);
        });

        loadUrlBtn.addEventListener('click', () => {
            const url = imageUrl.value.trim();
            if (!url) {
                showMessage('Please enter an image URL');
                return;
            }
            imagePreview.src = url;
            imagePreviewContainer.classList.remove('hidden');
            imagePreview.onload = () => extractMetadata(imagePreview);
            imagePreview.onerror = () => showMessage('Failed to load image from URL');
        });
    </script>
</body>
</html>
