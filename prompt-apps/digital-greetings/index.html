allery{border-top:0 solid #4f46e5;}.gallery h3{display:block;width:90%;height:auto;margin:0 auto;padding:1em;color:#4f46e5;}.isbox{display:flex;margin:0 auto;width:90%;box-sizing:border-box;padding:1em;justify-content:center;font-size:14px;color:#666;gap:10px;}.isbox .boxit{flex:1;}.jtright{text-align:right;}.gallery a.boxitx{flex:1;padding:0;text-align:center;color:#4f46e5;text-decoration:none;border-radius:11px;}.gallery a.boxitx:hover{background-color:#f1f1f1;color:#555;text-decoration:none;box-shadow:0 0 7px #ccc;}.gallery a.boxitx span{display:block;width:100%;height:auto;margin:0 auto;padding:1em;text-align:center;}.gallery a.boxitx img{display:block;width:100%;height:250px;background-color:#000;opacity:.6;object-fit:cover;margin:0 auto;transition:margin .3s ease-in-out,opacity .3s ease-in-out;}.gallery a.boxitx:hover img{margin:-10px auto 10px auto;opacity:1;}.isprompt{display:block;width:90%;height:auto;margin:0 auto;padding:1em;color:#4f46e5;}.iscode{display:block;width:100%;box-sizing:border-box;font-size:14px;color:#888;font-family:"Lucida Console",Monaco,monospace;margin:20px auto 22px auto;outline:none;max-height:300px;height:100px;min-height:100px;min-width:300px;max-width:100%;border:0;box-shadow:0 0 3px #4f46e5;border-radius:11px;padding:.8em;}@media (min-width:200px) and (max-width:550px){.isbox{flex-direction:column;gap:10px;}.gallery a.boxitx{flex:1;}}
    </style>
</head>
<body>
    <div class="isapp-app">
        <div class="container">
            <header>
                <h1>Prompt <span>Architect</span></h1>
                <p>4 AI-generated digital greetings.</p>
            </header>

            <div class="main-grid">
                <aside class="sidebar">
                    <div class="glass-card">
                        <div class="field-group">
                            <label class="label">Holiday Theme</label>
                            <input type="text" id="themeInput" placeholder="e.g., Ethereal phoenix...">
                            <div class="preset-container">
                                <button onclick="setPreset('St. Patrick\'s Day')" class="preset-btn">St. Pat's</button>
                                <button onclick="setPreset('Earth Day')" class="preset-btn">Earth Day</button>
                                <button onclick="setPreset('Diwali')" class="preset-btn">Diwali</button>
                                <button onclick="setPreset('Eid')" class="preset-btn">Eid</button>
                                <button onclick="setPreset('Lunar New Year')" class="preset-btn">Lunar NY</button>
                            </div>
                        </div>

                        <div class="field-group">
                            <label class="label">Text on Card (Optional)</label>
                            <input type="text" id="customText" placeholder="e.g., Happy Holidays 2026">
                        </div>

                        <div class="field-group">
                            <label class="label">Visual Style</label>
                            <select id="styleSelect">
                                <optgroup label="Realism">
                                    <option value="8k ultra-realistic photography, cinematic lighting">8k Ultra Realistic</option>
                                    <option value="cinematic movie still, dramatic lighting, anamorphic lens">Cinematic</option>
                                    <option value="macro photography, extreme detail, soft bokeh">Macro Detail</option>
                                </optgroup>
                                <optgroup label="Artistic">
                                    <option value="vibrant watercolor painting, wet-on-wet technique, delicate splatters">Watercolor</option>
                                    <option value="impasto oil painting, thick brushstrokes, textured canvas">Oil Painting</option>
                                    <option value="charcoal and graphite sketch, moody shading, hand-drawn">Sketch</option>
                                    <option value="art deco illustration, gold geometric lines, vintage">Art Deco</option>
                                </optgroup>
                                <optgroup label="Craft & 3D">
                                    <option value="intricate paper-origami, layered papercraft, 3D depth">Paper Origami</option>
                                    <option value="claymation style, soft plasticine textures, handcrafted">Claymation</option>
                                    <option value="stained glass window, vibrant translucent colors, lead outlines">Stained Glass</option>
                                    <option value="3D isometric render, Octane render, soft matte plastic">Isometric 3D</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="row">
                            <div class="field-group">
                                <label class="label">Ratio</label>
                                <select id="aspectRatio">
                                    <option value="--ar 4:5">4:5</option>
                                    <option value="--ar 1:1">1:1</option>
                                    <option value="--ar 16:9">16:9</option>
                                </select>
                            </div>
                            <div class="field-group">
                                <label class="label">Mode</label>
                                <select id="complexity">
                                    <option value="detailed">Pro</option>
                                    <option value="simple">Lite</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </aside>

                <main class="output-area">
                    <div class="glass-card output-container">
                        <div class="output-header">
                            <label class="label" style="margin-bottom: 0; color: var(--isapp-indigo-700)">Generated Architecture</label>
                            <span id="charCount" class="char-count">0 chars</span>
                        </div>
                        
                        <div id="outputContainer" class="output-display">
                            The architect is ready for your input...
                        </div>

                        <button onclick="copyPrompt()" class="copy-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            Copy Prompt
                        </button>
                    </div>
                </main>
            </div>
        </div>
        <div id="toast" class="copy-toast">Prompt copied!</div>
    </div>
 
 
  
    
<div class="gallery">
<h3>Tested with:</h3>
<div class="isprompt"><textarea class="iscode">An astonishing, high-concept greeting card masterpiece: mother nature cradling a vibrant bioluminescent Earth. Style: 8k ultra-realistic photography, cinematic lighting. The composition is ethereal with dynamic depth of field and volumetric lighting. Incorporate ultra-detailed textures like holographic foil, embossed heavy-stock paper, and magical atmospheric particles. The background is a vibrant, cinematic fusion of surreal colors and dreamlike bokeh. Professional studio lighting, 8k resolution, photorealistic macro details, hyper-vibrant color grading, symmetrical artistic composition. --v 6.0 --ar 4:5</textarea></div>

  </div>
  
</div>    
    
    
    
<div class="fofooter">
  <div class="isbox">
   <div class="boxit">
   <p>Generate greeting cards base design for Ai image generators</p>
   <p>a tiny app project made by Gemini</p>

    <script>
        const themeInput = document.getElementById('themeInput');
        const customText = document.getElementById('customText');
        const styleSelect = document.getElementById('styleSelect');
        const complexity = document.getElementById('complexity');
        const aspectRatio = document.getElementById('aspectRatio');
        const outputContainer = document.getElementById('outputContainer');
        const charCount = document.getElementById('charCount');
        const toast = document.getElementById('toast');

        const presets = {
            "St. Patrick's Day": "clover-covered Irish hills with glowing Celtic runes",
            "Earth Day": "mother nature cradling a vibrant bioluminescent Earth",
            "Diwali": "grand palace courtyard filled with thousands of golden oil lamps",
            "Eid": "majestic silver crescent moon above a glowing desert mosque",
            "Lunar New Year": "ornate red silk dragon dancing through floating golden lanterns"
        };

        function setPreset(key) {
            themeInput.value = presets[key];
            generate();
        }

        function generate() {
            const theme = themeInput.value.trim() || "[Define Theme]";
            const text = customText.value.trim();
            const style = styleSelect.value;
            const mode = complexity.value;
            const ar = aspectRatio.value;
            
            let textFragment = text ? `The card features the elegant, integrated typography: "${text}". ` : "";
            let prompt = "";

            if (mode === "detailed") {
                prompt = `An astonishing, high-concept greeting card masterpiece: ${theme}. Style: ${style}. ${textFragment}The composition is ethereal with dynamic depth of field and volumetric lighting. Incorporate ultra-detailed textures like holographic foil, embossed heavy-stock paper, and magical atmospheric particles. The background is a vibrant, cinematic fusion of surreal colors and dreamlike bokeh. Professional studio lighting, 8k resolution, photorealistic macro details, hyper-vibrant color grading, symmetrical artistic composition. --v 6.0 ${ar}`;
            } else {
                prompt = `Astonishing card: ${theme}. Style: ${style}. ${text ? 'Text: "' + text + '".' : ''} Vibrant magical atmosphere, glowing accents, cinematic, hyper-realistic, 8k, ${ar}`;
            }

            outputContainer.innerText = prompt;
            charCount.innerText = `${prompt.length} chars`;
        }

        function copyPrompt() {
            const text = outputContainer.innerText;
            if (text.includes("ready for your input")) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        [themeInput, customText, styleSelect, complexity, aspectRatio].forEach(el => {
            el.addEventListener('input', generate);
        });
    </script>
</body>
